[package]
name = "sweet-nothings"
version = "0.1.0"
edition = "2021"
description = "Terminal-based dictation tool"
license = "MIT"

[features]
default = ["whisper"]
whisper = []
parakeet = ["dep:parakeet-rs"]
ffmpeg = ["dep:tempfile"]

[dependencies]
# Audio capture
cpal = "0.15"
hound = "3.5"

# Clipboard
arboard = { version = "3", features = ["wayland-data-control"] }

# CLI
clap = { version = "4", features = ["derive"] }

# TUI
ratatui = "0.28"
crossterm = "0.28"

# Model downloads
reqwest = { version = "0.12", features = ["blocking", "stream"] }
indicatif = "0.17"

# Configuration
serde = { version = "1", features = ["derive"] }
toml = "0.8"
directories = "5"
humantime = "2"
humantime-serde = "1"

# Error handling
anyhow = "1"
thiserror = "1"

# Parakeet backend (optional)
parakeet-rs = { version = "0.3", optional = true }

# Audio format conversion (optional, for --file with non-WAV)
tempfile = { version = "3", optional = true }
